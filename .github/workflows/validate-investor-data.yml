name: Validate Codex investor data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/sec-13f-filings.json"
      - "filing-changes-latest.json"
      - "holdings-latest.json"
      - "eligible-universe.json"
      - "reference-data/cik-map.json"
      - "reference-data/cusip-map.json"
      - "reference-data/investor-universe.json"
      - "scripts/**"
      - "tests/**"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run investor accuracy tests
        run: python -m unittest discover -s tests -v
      - name: Compile pipeline code
        run: python -m py_compile scripts/*.py
      - name: Audit generated investor data
        run: python scripts/validate_investor_data.py --output /tmp/investor-data-audit.json
