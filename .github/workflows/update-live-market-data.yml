name: Update live market data

on:
  workflow_dispatch:
  schedule:
    # Market-hours refresh, Eastern daylight time mapped to UTC:
    # 9:30 AM-4:00 PM ET, Monday-Friday.
    - cron: "30-59/5 13 * * 1-5"
    - cron: "*/5 14-19 * * 1-5"
    - cron: "0 20 * * 1-5"
    # Off-hours heartbeat: hourly outside market hours plus weekends.
    - cron: "0 0-13,21-23 * * 1-5"
    - cron: "0 * * * 0,6"

permissions:
  contents: write

concurrency:
  group: mose-codex-pages-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MOSE_FB_URL: https://jfl-ttd-default-rtdb.firebaseio.com/mose-codex
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh quote snapshot
        run: python scripts/update_live_market_data.py
      # Commit even when the refresh fails so pipeline-status.json reaches the
      # dashboard and the stale-data banner can explain what happened.
      - name: Commit quote snapshot
        if: always()
        run: |
          if git diff --quiet live-quotes.json symbol-snapshots.json price-history.json pipeline-status.json; then
            echo "No quote changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live-quotes.json symbol-snapshots.json price-history.json pipeline-status.json
            git commit -m "Update live market data"
            git push origin main
            git push origin HEAD:gh-pages --force
          fi
